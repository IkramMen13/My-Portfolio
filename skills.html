<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikram's Skills</title>
   <!-- <link rel="stylesheet" href="skills.css">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
* {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    height: 100%;
    width: 100%;
    background-color: #f4ece2; 
    color: #3b2a20;
}

.homelink {
    display: flex;
    justify-content: flex-end;
    padding: 10px 15px;
}

.homelink a {
    font-size: 15px;
    background-color: #5b3a29;
    color: white;
    padding: 8px 14px;
    text-decoration: none;
    border-radius: 5px;
    transition: all 0.3s ease;
}

.homelink a:hover {
    border: 1px solid #765237;
    background-color: #eee2d6;
    color: #5b3a29;
}

h1.skill {
    background-color: #5b3a29;
    padding: 15px;
    color: white;
    border-radius: 15px;
    text-align: center;
    margin: 15px;
    transition: background-color 0.3s ease;
}

h1.skill:hover {
    background-color: #84593f;
}

.skillcontainer {
    display: grid;
    grid-template-rows: repeat(3, auto);
    gap: 20px;
    padding: 20px;
    width: 100%;
    min-height: 100vh; 
}

.codeskill, .softskill, .language {
    background-color: #fffaf5;
    border-radius: 15px;
    padding: 20px;
    color: #3b2a20;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
}

.codeskill:hover, .softskill:hover, .language:hover {
    background-color: #f0e1d2;
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.codeskill h2, .softskill h2, .language h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    font-size: 1.2rem;
    color: #5b3a29;
}

.codeskill h2 i, .softskill h2 i, .language h2 i {
    color: #84593f; 
}

ul.codelist, ul.softlist, ul.languagelist {
    padding-left: 25px;
    line-height: 1.6;
}

@media (min-width: 769px) {
    .skillcontainer {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto;
    }

    ul.codelist, ul.softlist, ul.languagelist {
        font-size: 1.2rem; 
    }

    .codeskill h2, .softskill h2, .language h2 {
        font-size: 1.5rem; 
    }

    h1.skill {
        font-size: 2.2rem; 
    }

}
    </style>



</head>
<body>
    <div class="homelink">
        <a href="home.html">Home</a>
    </div>

    <h1 class="skill">My Skills</h1>

    <div class="skillcontainer">
        <div class="codeskill">
            <h2><i class="fas fa-code"></i> Programming Skills</h2>
            <ul class="codelist">
                <li>C++</li>
                <li>Java</li>
                <li>C#</li>
                <li>Database programming</li>
                <li>HTML, CSS, JavaScript</li>
            </ul>
        </div>

        <div class="softskill">
            <h2><i class="fas fa-users"></i> Soft Skills</h2>
            <ul class="softlist">
                <li>Communication</li>
                <li>Team Work</li>
                <li>Critical Thinking</li>
                <li>Time Management</li>
                <li>Problem Solving</li>
            </ul>
        </div>

        <div class="language">
            <h2><i class="fas fa-language"></i> Languages</h2>
            <ul class="languagelist">
                <li>English — Advanced</li>
                <li>Amharic — Native</li>
                <li>Arabic — Beginner</li>
            </ul>
        </div>
    </div>
</body>
</html>
